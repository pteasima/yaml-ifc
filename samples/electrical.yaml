# Nominal electrical example: one board and the devices on it.
# Sizes are round module dimensions, not a survey. Not a real house.
# See docs/spec.md. The panel is a whole element; its breakers are not modeled.
# Cable routes are metres in the storey frame (x, y as Origin, z as Elevation).
# 0.001 is one millimetre. Horizontal runs sit in the wall, 2.5 m up.
schema: IFC4 ADD2 TC1
units:
  LengthUnit: METRE
project:
  id: PRJ
  Name: Electrical example
  Aggregates: [SITE]
site:
  id: SITE
  Aggregates: [BLD]
building:
  id: BLD
  Aggregates: [STOREY-1NP]
storey:
  id: STOREY-1NP
  Name: "1.NP"
  Elevation: 0
spaces:
  - id: SPACE-room
    Name: Room
    PredefinedType: INTERNAL
# A nominal room so the cables have a wall to run in. Axes are centrelines.
# Inner faces are x=0, y=0, x=2.7, y=2.5. Thickness 0.2 m, head 2.6 m.
walls:
  - id: W-west
    Axis:
      Start: [-0.1, -0.1]
      End: [-0.1, 2.6]
    Thickness: 0.2
    Height: 2.6
  - id: W-south
    Axis:
      Start: [-0.1, -0.1]
      End: [2.8, -0.1]
    Thickness: 0.2
    Height: 2.6
  - id: W-east
    Axis:
      Start: [2.8, -0.1]
      End: [2.8, 2.6]
    Thickness: 0.2
    Height: 2.6
  - id: W-north
    Axis:
      Start: [-0.1, 2.6]
      End: [2.8, 2.6]
    Thickness: 0.2
    Height: 2.6
openings: []
doors: []
windows: []
lightFixtures:
  - id: LIGHT-down
    Name: Downlight
    PredefinedType: POINTSOURCE
    ObjectType: Downlight
    ContainedInStructure: SPACE-room
    Origin: [1.2, 1.6]
    Elevation: 2.4
    Width: 0.12
    Depth: 0.12
    Height: 0.05
    Wattage: 12
    CctMin: 2700
    CctMax: 6500
switchingDevices:
  - id: SW-entry
    Name: Entry switch
    PredefinedType: TOGGLESWITCH
    ObjectType: ToggleSwitch
    ContainedInStructure: SPACE-room
    Origin: [0.1, 1.2]
    Elevation: 1.1
    Width: 0.08
    Depth: 0.01
    Height: 0.08
  - id: SW-bed
    Name: Bed button
    PredefinedType: MOMENTARYSWITCH
    ObjectType: PushButton
    ContainedInStructure: SPACE-room
    Origin: [2.4, 0.1]
    Elevation: 0.8
    Width: 0.08
    Depth: 0.01
    Height: 0.08
sensors:
  - id: SEN-presence
    Name: Presence
    PredefinedType: MOVEMENTSENSOR
    ObjectType: MmWavePresence
    ContainedInStructure: SPACE-room
    Origin: [1.6, 2.2]
    Elevation: 2.5
    Width: 0.06
    Depth: 0.06
    Height: 0.02
  - id: SEN-door
    Name: Door contact
    PredefinedType: CONTACTSENSOR
    ObjectType: DoorContact
    ContainedInStructure: SPACE-room
    Origin: [0.05, 2.2]
    Elevation: 1
    Width: 0.04
    Depth: 0.01
    Height: 0.02
outlets:
  - id: OUT-room
    Name: Socket
    PredefinedType: POWEROUTLET
    ObjectType: Socket
    ContainedInStructure: SPACE-room
    Origin: [2.5, 1]
    Elevation: 0.3
    Width: 0.08
    Depth: 0.01
    Height: 0.08
    PropertySets:
      - Name: Pset_OutletTypeCommon
        Properties:
          NumberOfSockets: 2
actuators:
  - id: ACT-blind
    Name: Blind actuator
    PredefinedType: ELECTRICACTUATOR
    ObjectType: BlindActuator
    ContainedInStructure: SPACE-room
    Origin: [0.8, 2.3]
    Elevation: 2.2
    Width: 0.4
    Depth: 0.06
    Height: 0.06
    PropertySets:
      - Name: Pset_ActuatorTypeCommon
        Properties:
          Application: SUNBLINDACTUATOR
      - Name: Pset_ActuatorTypeElectricActuator
        Properties:
          ElectricActuatorType: MOTORDRIVE
          ActuatorInputPower: 20
distributionBoards:
  - id: DB-main
    Name: Main board
    PredefinedType: DISTRIBUTIONBOARD
    ObjectType: MainBoard
    ContainedInStructure: SPACE-room
    Origin: [0.1, 0.1]
    Elevation: 1.4
    Width: 0.36
    Depth: 0.1
    Height: 0.6
# Each route leaves the top of the board, runs in the wall at 2.5 m, and drops
# to the device. The light's last segment is the drop from the ceiling.
cables:
  - id: CBL-light
    PredefinedType: CABLESEGMENT
    ObjectType: LightingCable
    From: DB-main
    To: LIGHT-down
    Route:
      - [0.16, 0.15, 2]
      - [0.16, -0.04, 2]
      - [0.16, -0.04, 2.5]
      - [1.26, -0.04, 2.5]
      - [1.26, 1.66, 2.5]
      - [1.26, 1.66, 2.4]
    NumberOfCores: 3
  - id: CBL-switch
    PredefinedType: CABLESEGMENT
    ObjectType: LightingCable
    From: DB-main
    To: SW-entry
    Route:
      - [0.2, 0.15, 2]
      - [-0.04, 0.15, 2]
      - [-0.04, 0.15, 2.5]
      - [-0.04, 1.205, 2.5]
      - [-0.04, 1.205, 1.14]
      - [0.14, 1.205, 1.14]
    NumberOfCores: 3
  - id: CBL-button
    PredefinedType: CABLESEGMENT
    ObjectType: LightingCable
    From: DB-main
    To: SW-bed
    Route:
      - [0.24, 0.15, 2]
      - [0.24, -0.08, 2]
      - [0.24, -0.08, 2.5]
      - [2.44, -0.08, 2.5]
      - [2.44, -0.08, 0.84]
      - [2.44, 0.105, 0.84]
    NumberOfCores: 3
  - id: CBL-outlet
    PredefinedType: CABLESEGMENT
    ObjectType: PowerCable
    From: DB-main
    To: OUT-room
    Route:
      - [0.28, 0.15, 2]
      - [0.28, -0.12, 2]
      - [0.28, -0.12, 2.5]
      - [2.76, -0.12, 2.5]
      - [2.76, 1.005, 2.5]
      - [2.76, 1.005, 0.34]
      - [2.54, 1.005, 0.34]
    NumberOfCores: 3
  - id: CBL-presence
    PredefinedType: CABLESEGMENT
    ObjectType: SignalCable
    From: DB-main
    To: SEN-presence
    Route:
      - [0.32, 0.15, 2]
      - [-0.07, 0.15, 2]
      - [-0.07, 0.15, 2.5]
      - [-0.07, 2.56, 2.5]
      - [1.63, 2.56, 2.5]
      - [1.63, 2.23, 2.5]
      - [1.63, 2.23, 2.51]
    NumberOfCores: 2
  - id: CBL-door
    PredefinedType: CABLESEGMENT
    ObjectType: SignalCable
    From: DB-main
    To: SEN-door
    Route:
      - [0.36, 0.15, 2]
      - [-0.1, 0.15, 2]
      - [-0.1, 0.15, 2.5]
      - [-0.1, 2.205, 2.5]
      - [-0.1, 2.205, 1.01]
      - [0.07, 2.205, 1.01]
    NumberOfCores: 2
  - id: CBL-blind
    PredefinedType: CABLESEGMENT
    ObjectType: PowerCable
    From: DB-main
    To: ACT-blind
    Route:
      - [0.4, 0.15, 2]
      - [-0.13, 0.15, 2]
      - [-0.13, 0.15, 2.5]
      - [-0.13, 2.6, 2.5]
      - [1, 2.6, 2.5]
      - [1, 2.6, 2.23]
      - [1, 2.33, 2.23]
    NumberOfCores: 4
circuits:
  - id: CIR-lights
    Name: Lights
    PredefinedType: LIGHTING
    Assigns: [DB-main, LIGHT-down, SW-entry, SW-bed, CBL-light, CBL-switch, CBL-button]
  - id: CIR-power
    Name: Power
    PredefinedType: ELECTRICAL
    Assigns: [DB-main, OUT-room, ACT-blind, CBL-outlet, CBL-blind]
  - id: CIR-sense
    Name: Sensors
    PredefinedType: CONTROL
    Assigns: [DB-main, SEN-presence, SEN-door, CBL-presence, CBL-door]
