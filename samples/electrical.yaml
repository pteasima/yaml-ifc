# Nominal electrical example: one board and the devices on it.
# Sizes are round module dimensions, not a survey. Not a real house.
# See docs/spec.md. The panel is a whole element; its breakers are not modeled.
schema: IFC4 ADD2 TC1
units:
  LengthUnit: METRE
project:
  id: PRJ
  Name: Electrical example
  Aggregates: [SITE]
site:
  id: SITE
  Aggregates: [BLD]
building:
  id: BLD
  Aggregates: [STOREY-1NP]
storey:
  id: STOREY-1NP
  Name: "1.NP"
  Elevation: 0
spaces:
  - id: SPACE-room
    Name: Room
    PredefinedType: INTERNAL
walls: []
openings: []
doors: []
windows: []
lightFixtures:
  - id: LIGHT-down
    Name: Downlight
    PredefinedType: POINTSOURCE
    ObjectType: Downlight
    ContainedInStructure: SPACE-room
    Origin: [1.2, 1.6]
    Elevation: 2.4
    Width: 0.12
    Depth: 0.12
    Height: 0.05
    Wattage: 12
    CctMin: 2700
    CctMax: 6500
switchingDevices:
  - id: SW-entry
    Name: Entry switch
    PredefinedType: TOGGLESWITCH
    ObjectType: ToggleSwitch
    ContainedInStructure: SPACE-room
    Origin: [0.1, 1.2]
    Elevation: 1.1
    Width: 0.08
    Depth: 0.01
    Height: 0.08
  - id: SW-bed
    Name: Bed button
    PredefinedType: MOMENTARYSWITCH
    ObjectType: PushButton
    ContainedInStructure: SPACE-room
    Origin: [2.4, 0.1]
    Elevation: 0.8
    Width: 0.08
    Depth: 0.01
    Height: 0.08
sensors:
  - id: SEN-presence
    Name: Presence
    PredefinedType: MOVEMENTSENSOR
    ObjectType: MmWavePresence
    ContainedInStructure: SPACE-room
    Origin: [1.6, 2.2]
    Elevation: 2.5
    Width: 0.06
    Depth: 0.06
    Height: 0.02
  - id: SEN-door
    Name: Door contact
    PredefinedType: CONTACTSENSOR
    ObjectType: DoorContact
    ContainedInStructure: SPACE-room
    Origin: [0.05, 2.2]
    Elevation: 1
    Width: 0.04
    Depth: 0.01
    Height: 0.02
outlets:
  - id: OUT-room
    Name: Socket
    PredefinedType: POWEROUTLET
    ObjectType: Socket
    ContainedInStructure: SPACE-room
    Origin: [2.5, 1]
    Elevation: 0.3
    Width: 0.08
    Depth: 0.01
    Height: 0.08
    PropertySets:
      - Name: Pset_OutletTypeCommon
        Properties:
          NumberOfSockets: 2
actuators:
  - id: ACT-blind
    Name: Blind actuator
    PredefinedType: ELECTRICACTUATOR
    ObjectType: BlindActuator
    ContainedInStructure: SPACE-room
    Origin: [0.8, 2.3]
    Elevation: 2.2
    Width: 0.4
    Depth: 0.06
    Height: 0.06
    PropertySets:
      - Name: Pset_ActuatorTypeCommon
        Properties:
          Application: SUNBLINDACTUATOR
      - Name: Pset_ActuatorTypeElectricActuator
        Properties:
          ElectricActuatorType: MOTORDRIVE
          ActuatorInputPower: 20
distributionBoards:
  - id: DB-main
    Name: Main board
    PredefinedType: DISTRIBUTIONBOARD
    ObjectType: MainBoard
    ContainedInStructure: SPACE-room
    Origin: [0.1, 0.1]
    Elevation: 1.4
    Width: 0.36
    Depth: 0.1
    Height: 0.6
cables:
  - id: CBL-light
    PredefinedType: CABLESEGMENT
    ObjectType: LightingCable
    From: DB-main
    To: LIGHT-down
  - id: CBL-switch
    PredefinedType: CABLESEGMENT
    ObjectType: LightingCable
    From: DB-main
    To: SW-entry
  - id: CBL-button
    PredefinedType: CABLESEGMENT
    ObjectType: LightingCable
    From: DB-main
    To: SW-bed
  - id: CBL-outlet
    PredefinedType: CABLESEGMENT
    ObjectType: PowerCable
    From: DB-main
    To: OUT-room
  - id: CBL-presence
    PredefinedType: CABLESEGMENT
    ObjectType: SignalCable
    From: DB-main
    To: SEN-presence
  - id: CBL-door
    PredefinedType: CABLESEGMENT
    ObjectType: SignalCable
    From: DB-main
    To: SEN-door
  - id: CBL-blind
    PredefinedType: CABLESEGMENT
    ObjectType: PowerCable
    From: DB-main
    To: ACT-blind
circuits:
  - id: CIR-lights
    Name: Lights
    PredefinedType: LIGHTING
    Assigns: [DB-main, LIGHT-down, SW-entry, SW-bed, CBL-light, CBL-switch, CBL-button]
  - id: CIR-power
    Name: Power
    PredefinedType: ELECTRICAL
    Assigns: [DB-main, OUT-room, ACT-blind, CBL-outlet, CBL-blind]
  - id: CIR-sense
    Name: Sensors
    PredefinedType: CONTROL
    Assigns: [DB-main, SEN-presence, SEN-door, CBL-presence, CBL-door]
